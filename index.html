
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal Deal</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f5f6fa;color:#202333}
    h1{margin-bottom:4px}
    .card{background:white;padding:16px;margin:14px 0;border-radius:14px;box-shadow:0 2px 8px #0001}
    input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccd0da;border-radius:9px;font-size:16px}
    button{background:#202333;color:white;border:0;font-weight:bold}
    .muted{color:#626779;font-size:14px}
    .status{overflow-wrap:anywhere}
  </style>
</head>
<body>
  <h1>🤝 Universal Deal</h1>
  <p class="muted">Buyer-led negotiation · Transparent deals</p>

  <div class="card">
    <h2>Connection status</h2>
    <p id="status" class="status">Checking configuration…</p>
    <button onclick="loadListings()">Refresh listings</button>
  </div>

  <div class="card">
    <h2>Post a listing</h2>
    <form id="listingForm">
      <label>Product or service</label>
      <input id="title" required maxlength="120" placeholder="e.g. Used study table">
      <label>Description</label>
      <textarea id="description" maxlength="1000" placeholder="Describe the item"></textarea>
      <label>Category</label>
      <select id="category">
        <option>Products</option>
        <option>Services</option>
        <option>Property</option>
        <option>Vehicles</option>
        <option>Other</option>
      </select>
      <label>Seller's minimum price (₹)</label>
      <input id="minimum" type="number" min="1" step="1" required>
      <label>Listed price (₹)</label>
      <input id="price" type="number" min="1" step="1" required>
      <label>Location (optional)</label>
      <input id="location" maxlength="120" placeholder="City">
      <button type="submit">Add listing</button>
    </form>
  </div>

  <div class="card">
    <h2>Available listings</h2>
    <div id="listings">Loading…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://apfwcxjaafzbjuaemxak.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PbczD25Us5legTp0SnCojw_AxiScFOF";

    let db = null;
    const status = document.getElementById("status");
    const listingBox = document.getElementById("listings");

    if (window.supabase) {
      db = window.supabase.createClient(
        SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
      );
      status.textContent = "Client configured. Checking database access…";
      loadListings();
    } else {
      status.textContent =
        "Not connected yet. Add the Supabase publishable key to configure the client.";
      listingBox.textContent = "Database connection not configured.";
    }

    async function loadListings() {
      if (!db) return;
      listingBox.textContent = "Loading listings…";
      const { data, error } = await db
        .from("listings")
        .select("id,title,description,category,seller_min_price,price,location,created_at")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "Database access error: " + error.message;
        listingBox.textContent =
          "Could not load listings. Database permissions may need setup.";
        return;
      }

      status.textContent = "Database read succeeded.";
      listingBox.replaceChildren();

      if (!data || data.length === 0) {
        listingBox.textContent = "No listings yet.";
        return;
      }

      data.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        const heading = document.createElement("h3");
        heading.textContent = item.title || "Untitled listing";
        const description = document.createElement("p");
        description.textContent = item.description || "";
        const price = document.createElement("p");
        price.textContent = "Listed: ₹" + item.price +
          " · Seller minimum: ₹" + item.seller_min_price;
        const meta = document.createElement("p");
        meta.className = "muted";
        meta.textContent = [item.category, item.location].filter(Boolean).join(" · ");
        card.append(heading, description, price, meta);
        listingBox.append(card);
      });
    }

    document.getElementById("listingForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (!db) {
        alert("First configure the Supabase publishable key.");
        return;
      }

      const minimum = Number(document.getElementById("minimum").value);
      const price = Number(document.getElementById("price").value);
      if (minimum <= 0 || price <= 0 || minimum > price) {
        alert("Enter positive prices. Listed price must be at least the seller minimum.");
        return;
      }

      const listing = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        category: document.getElementById("category").value,
        seller_min_price: minimum,
        price: price,
        location: document.getElementById("location").value.trim() || null
      };

      const { error } = await db.from("listings").insert(listing);
      if (error) {
        alert("Listing was not saved: " + error.message);
        return;
      }

      alert("Listing saved to the database.");
      event.target.reset();
      await loadListings();
    });
  </script>
</body>
</html>
